name: Fetch Full Dump
permissions:
  contents: write
on:
  repository_dispatch:
    types: [new_version]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version hash to extract dump for'
        required: true
        type: string
concurrency:
  group: roblox-authentication
  cancel-in-progress: false
jobs:
  extract:
    runs-on: windows-latest  # Studio only runs on Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Resolve version input
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            RAW="${{ github.event.client_payload.version }}"
          else
            RAW="${{ inputs.version }}"
          fi
          # Normalize: strip a leading "version-" prefix if present, so we always end up with a bare hash
          VERSION="${RAW#version-}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Run full dump extraction
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
        run: node scripts/fetch-full-dump.mjs --version "${{ steps.vars.outputs.version }}"
      - name: Move dump into full-dumps folder
        shell: bash
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          mkdir -p full-dumps
          cp "RobloxStudio/Merged-API-Dump.json" "full-dumps/version-$VERSION-Full-API-Dump.json"
      - name: Commit and push dump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add full-dumps/ reflectionservice-dumps/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[Studio] Add dumps for version-${{ steps.vars.outputs.version }}" -m "Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            # Another dump run can commit the same file (for example the same version hash produced by a
            # concurrent ReflectionService run) between our checkout and our push. That surfaces as an
            # add/add conflict on `git pull --rebase`, which retrying the identical pull can never clear,
            # so prefer this run's freshly generated dumps when a hunk conflicts and rebase again.
            for n in 1 2 3 4 5; do
              if git fetch origin main && git rebase --strategy-option=theirs origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || git rebase --quit 2>/dev/null || true
              echo "Push attempt $n failed"
              sleep $((n*5))
            done
            echo "Push failed after 5 attempts"
            exit 1
          fi
