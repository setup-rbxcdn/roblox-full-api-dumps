name: Fetch ReflectionService Dump

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'JSON array of {version, engine_version} candidates; the candidate matching the Open Cloud engine version() is dumped'
        required: true
        type: string

concurrency:
  group: reflection-service
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version candidates
        id: vars
        shell: bash
        env:
          INPUT_VERSIONS: ${{ inputs.versions }}
        run: |
          if ! echo "$INPUT_VERSIONS" | jq -e '
            type == "array"
            and length > 0
            and all(
              type == "object"
              and (.version | type) == "string" and (.version | length) > 0
              and (.engine_version | type) == "string" and (.engine_version | length) > 0
            )' > /dev/null; then
            echo "Invalid candidates JSON: $INPUT_VERSIONS" >&2
            exit 1
          fi

          CANDIDATES_FILE="$RUNNER_TEMP/reflection-candidates.json"
          printf '%s\n' "$INPUT_VERSIONS" > "$CANDIDATES_FILE"
          echo "candidates_file=$CANDIDATES_FILE" >> "$GITHUB_OUTPUT"

          echo "Resolved candidates:"
          jq -r '.[] | "  - \(.version) (\(.engine_version))"' "$CANDIDATES_FILE"

      - name: Extract ReflectionService dump
        id: extract
        env:
          RBLX_OC_API_KEY: ${{ secrets.RBLX_OC_API_KEY }}
          RBLX_UNIVERSE_ID: ${{ secrets.RBLX_UNIVERSE_ID }}
          RBLX_PLACE_ID: ${{ secrets.RBLX_PLACE_ID }}
        shell: bash
        run: |
          RESULT="$RUNNER_TEMP/reflection-result.json"

          set +e
          python scripts/fetch-reflection-service-dump.py \
            --candidates "${{ steps.vars.outputs.candidates_file }}" \
            --result "$RESULT"
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 3 ]; then
            # No candidate matches the engine yet; the script logged why.
            exit 0
          fi

          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi

          if [ ! -f "$RESULT" ]; then
            echo "Expected a result file at $RESULT" >&2
            exit 1
          fi

          jq -r '"result: " + .status' "$RESULT"
          echo "written=$(jq -r '.output // ""' "$RESULT")" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version // ""' "$RESULT")" >> "$GITHUB_OUTPUT"

      - name: Commit and push dump
        if: steps.extract.outputs.written != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reflectionservice-dumps/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add ReflectionService dump for version-${{ steps.extract.outputs.version }}"
            git pull --rebase
            git push
          fi
