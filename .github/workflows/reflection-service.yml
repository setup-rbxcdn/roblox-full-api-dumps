name: Fetch ReflectionService Dump

permissions:
  contents: write

on:
  repository_dispatch:
    types: [live_version]
  workflow_dispatch:
    inputs:
      version:
        description: Studio deployment hash, with or without version-
        required: true
        type: string
      engine_version:
        description: Numeric engine version returned by version()
        required: true
        type: string

concurrency:
  group: reflection-service-${{ github.event.client_payload.version || inputs.version }}
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version input
        id: vars
        shell: bash
        env:
          EVENT_VERSION: ${{ github.event.client_payload.version }}
          EVENT_ENGINE_VERSION: ${{ github.event.client_payload.engine_version }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ENGINE_VERSION: ${{ inputs.engine_version }}
        run: |
          RAW_VERSION="${EVENT_VERSION:-$INPUT_VERSION}"
          echo "version=${RAW_VERSION#version-}" >> "$GITHUB_OUTPUT"
          echo "engine_version=${EVENT_ENGINE_VERSION:-$INPUT_ENGINE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract ReflectionService dump
        id: extract
        env:
          RBLX_OC_API_KEY: ${{ secrets.RBLX_OC_API_KEY }}
          RBLX_UNIVERSE_ID: ${{ secrets.RBLX_UNIVERSE_ID }}
          RBLX_PLACE_ID: ${{ secrets.RBLX_PLACE_ID }}
          RBLX_EXPECTED_VERSION: ${{ steps.vars.outputs.engine_version }}
        shell: bash
        run: |
          set +e
          python scripts/fetch-reflection-service-dump.py \
            --version "${{ steps.vars.outputs.version }}" \
            --output "reflectionservice-dumps/version-${{ steps.vars.outputs.version }}-ReflectionService-Dump.json"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 3 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push dump
        if: steps.extract.outputs.ready == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reflectionservice-dumps/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add ReflectionService dump for version-${{ steps.vars.outputs.version }}"
            git pull --rebase
            git push
          fi
