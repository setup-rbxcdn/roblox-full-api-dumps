name: Fetch ReflectionService Dump

permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: reflection-service
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Extract ReflectionService dump
        id: extract
        env:
          RBLX_OC_API_KEY: ${{ secrets.RBLX_OC_API_KEY }}
          RBLX_UNIVERSE_ID: ${{ secrets.RBLX_UNIVERSE_ID }}
          RBLX_PLACE_ID: ${{ secrets.RBLX_PLACE_ID }}
        shell: bash
        run: |
          RESULT="$RUNNER_TEMP/reflection-result.json"

          python scripts/fetch-reflection-service-dump.py --result "$RESULT"

          if [ ! -f "$RESULT" ]; then
            echo "Expected a result file at $RESULT" >&2
            exit 1
          fi

          jq -r '"result: " + .status + " (engine " + (.engine_version // "?") + ")"' "$RESULT"
          echo "outputs=$(jq -rc '.outputs // [] | join(" ")' "$RESULT")" >> "$GITHUB_OUTPUT"
          echo "engine_version=$(jq -r '.engine_version // ""' "$RESULT")" >> "$GITHUB_OUTPUT"

      - name: Commit and push dump
        if: steps.extract.outputs.outputs != ''
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reflectionservice-dumps/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[OpenCloud] Add ReflectionService dump for ${{ steps.extract.outputs.engine_version }}" -m "Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            # Another dump run can commit the same file (for example the same version hash produced by a
            # concurrent full dump run) between our checkout and our push. That surfaces as an add/add
            # conflict on `git pull --rebase`, which retrying the identical pull can never clear, so prefer
            # this run's freshly generated dumps when a hunk conflicts and rebase again.
            for n in 1 2 3 4 5; do
              if git fetch origin main && git rebase --strategy-option=theirs origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || git rebase --quit 2>/dev/null || true
              echo "Push attempt $n failed"
              sleep $((n*5))
            done
            echo "Push failed after 5 attempts"
            exit 1
          fi
